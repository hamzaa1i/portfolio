<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Reve ERP material-flow diagram — card thumbnail -->
  <rect width="1600" height="1000" fill="#09090b"/>

  <!-- title band -->
  <text x="120" y="150" fill="#c8a24e" font-size="30" letter-spacing="6">REVE MANUFACTURING ERP</text>
  <text x="120" y="196" fill="#71717a" font-size="24" letter-spacing="2">MATERIAL FLOW · ERPNEXT / FRAPPE</text>
  <line x1="120" y1="240" x2="1480" y2="240" stroke="#27272a" stroke-width="2"/>

  <!-- row 1: receipt → batch/LOT → gate pass -->
  <g>
    <rect x="120" y="330" width="360" height="130" rx="10" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <text x="300" y="386" fill="#fafafa" font-size="26" text-anchor="middle">Material Receipt</text>
    <text x="300" y="424" fill="#71717a" font-size="20" text-anchor="middle">Stock Entry · inward</text>

    <path d="M510 395 h90 m0 0 l-14 -10 m14 10 l-14 10" stroke="#a68535" stroke-width="3" fill="none"/>

    <rect x="620" y="330" width="360" height="130" rx="10" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <text x="800" y="386" fill="#fafafa" font-size="26" text-anchor="middle">Batch / LOT</text>
    <text x="800" y="424" fill="#71717a" font-size="20" text-anchor="middle">roll-level traceability</text>

    <path d="M1010 395 h90 m0 0 l-14 -10 m14 10 l-14 10" stroke="#a68535" stroke-width="3" fill="none"/>

    <rect x="1120" y="330" width="360" height="130" rx="10" fill="none" stroke="#3f3f46" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="1300" y="386" fill="#fafafa" font-size="26" text-anchor="middle">Gate Pass</text>
    <text x="1300" y="424" fill="#71717a" font-size="20" text-anchor="middle">dyeing · external process</text>
  </g>

  <!-- connector down -->
  <path d="M800 460 v70 m0 0 l-10 -14 m10 14 l10 -14" stroke="#a68535" stroke-width="3" fill="none"/>

  <!-- row 2: transfer/issue → production -->
  <g>
    <rect x="280" y="560" width="360" height="130" rx="10" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <text x="460" y="616" fill="#fafafa" font-size="26" text-anchor="middle">Transfer / Issue</text>
    <text x="460" y="654" fill="#71717a" font-size="20" text-anchor="middle">store → cutting → stitching</text>

    <path d="M670 625 h90 m0 0 l-14 -10 m14 10 l-14 10" stroke="#a68535" stroke-width="3" fill="none"/>

    <rect x="790" y="560" width="360" height="130" rx="10" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <text x="970" y="616" fill="#fafafa" font-size="26" text-anchor="middle">Production</text>
    <text x="970" y="654" fill="#71717a" font-size="20" text-anchor="middle">Critical Path · order tracking</text>
  </g>

  <!-- connector down -->
  <path d="M800 690 v70 m0 0 l-10 -14 m10 14 l10 -14" stroke="#a68535" stroke-width="3" fill="none"/>

  <!-- row 3: visibility band -->
  <rect x="280" y="790" width="870" height="110" rx="10" fill="#111113" stroke="#27272a" stroke-width="2"/>
  <text x="715" y="838" fill="#c8a24e" font-size="26" text-anchor="middle" letter-spacing="3">STOCK REPORTING · OPERATIONAL VISIBILITY</text>
  <text x="715" y="872" fill="#71717a" font-size="20" text-anchor="middle">live fabric stock · custom reports · dashboards</text>

  <!-- footnote -->
  <text x="120" y="950" fill="#52525b" font-size="19">Internal system · ERPNext customized to factory workflows</text>
</svg>
