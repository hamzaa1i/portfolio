<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Reve Manufacturing ERP</title><desc>Illustrative view of the legacy Fabric Store ERPNext workflow, separate from REVE ONE. No actual records.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#070707"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#121212"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".35"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="70" y="90" width="1460" height="720" rx="24" fill="#101010" stroke="#36322b" filter="url(#shadow)"/><g font-family="Inter,Arial,sans-serif"><text x="125" y="166" fill="#d4af73" font-size="17" letter-spacing="4">LEGACY FABRIC STORE / WORKFLOW</text><text x="125" y="234" fill="#f4f4f4" font-size="48" font-weight="600">Reve Manufacturing ERP</text><text x="125" y="275" fill="#aaa" font-size="22">ERPNext configuration and customization for material traceability.</text><rect x="125" y="334" width="400" height="234" rx="14" fill="url(#panel)" stroke="#3d3a34"/><text x="155" y="383" fill="#c6a66e" font-size="16" letter-spacing="3">01 / MOVEMENT</text><text x="155" y="429" fill="#fafafa" font-size="29" font-weight="600">Stock Entries</text><text x="155" y="483" fill="#c2c2c2" font-size="22">Receipts · transfers</text><text x="155" y="519" fill="#949494" font-size="20">Issues · returns</text><rect x="600" y="334" width="400" height="234" rx="14" fill="url(#panel)" stroke="#3d3a34"/><text x="630" y="383" fill="#c6a66e" font-size="16" letter-spacing="3">02 / TRACEABILITY</text><text x="630" y="429" fill="#fafafa" font-size="29" font-weight="600">Batches + LOTs</text><text x="630" y="483" fill="#c2c2c2" font-size="22">Fabric Store context</text><text x="630" y="519" fill="#949494" font-size="20">Linked material records</text><rect x="1075" y="334" width="400" height="234" rx="14" fill="url(#panel)" stroke="#3d3a34"/><text x="1105" y="383" fill="#c6a66e" font-size="16" letter-spacing="3">03 / CONTROL</text><text x="1105" y="429" fill="#fafafa" font-size="29" font-weight="600">Gate passes</text><text x="1105" y="483" fill="#c2c2c2" font-size="22">Physical movements</text><text x="1105" y="519" fill="#949494" font-size="20">Operational reporting</text><path d="M525 450H572 M1025 450H1072" stroke="#c7a76d" stroke-width="2"/><path d="m560 442 12 8-12 8m500-16 12 8-12 8" fill="none" stroke="#c7a76d" stroke-width="2"/><path d="M800 568V622" stroke="#8d7754" stroke-width="2"/><rect x="125" y="622" width="1350" height="90" rx="12" fill="#191817" stroke="#3e382e"/><text x="155" y="658" fill="#d2b584" font-size="18" letter-spacing="2">SCOPE BOUNDARY</text><text x="155" y="688" fill="#ddd" font-size="24">Legacy ERPNext customization     /     REVE ONE is a separate application</text><text x="125" y="765" fill="#969696" font-size="18">ILLUSTRATION · Architecture relationships, not a running interface capture.</text></g></svg>